trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

steps:
- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.13'
  displayName: 'Install Python 3.13'

- script: |
    python -m pip install --upgrade pip
    pip install -r requirements.txt
  displayName: 'Install Dependencies'

- script: |
    echo "MONGO_URI=$MONGO_URI" > .env
    echo ".env file generated for the build environment"
  displayName: 'Generate Environment Configuration'
  env:
    MONGO_URI: $(MONGO_URI)

- script: |
    python -c "import os; from pymongo import MongoClient; print('Checking Mongo Connection...'); client = MongoClient(os.environ.get('MONGO_URI')); print('Connection Successful!')"
  displayName: 'Validate Database Connectivity'
  env:
    MONGO_URI: $(MONGO_URI)

- task: AzureWebApp@1
  displayName: 'Deploy Academic Evaluator'
  inputs:
    azureSubscription: 'AcademicEvaluatorSC'
    appName: 'academic-evaluator'
    package: '$(System.DefaultWorkingDirectory)'